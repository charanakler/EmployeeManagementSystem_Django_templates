{% extends 'accounts/auth_base.html' %}

{% block auth_content %}
<h2 class="h4 mb-3">Check your email</h2>
<p>If an active account exists for that address, we sent password-reset instructions.</p>
<p class="small text-muted">During local development, the reset link appears in the terminal running Django.</p>
<a class="btn btn-outline-primary w-100" href="{% url 'login' %}">Back to login</a>
{% endblock auth_content %}
