{% extends 'accounts/auth_base.html' %}

{% block title %}Login | Employee Management{% endblock %}

{% block auth_content %}
<h2 class="h4 mb-3">Sign in</h2>
{% if form.errors %}<div class="alert alert-danger">Your username or password is incorrect.</div>{% endif %}
<form method="post" novalidate>
    {% csrf_token %}
    <div class="mb-3">
        <label for="id_username" class="form-label">Username</label>
        <input type="text" name="username" id="id_username" class="form-control" required autofocus>
    </div>
    <div class="mb-3">
        <label for="id_password" class="form-label">Password</label>
        <input type="password" name="password" id="id_password" class="form-control" required>
    </div>
    <input type="hidden" name="next" value="{{ next }}">
    <button class="btn btn-primary w-100" type="submit">Login</button>
</form>
<div class="d-flex justify-content-between mt-3 small">
    <a href="{% url 'forgot_password' %}">Forgot password?</a>
    <a href="{% url 'register' %}">Create an account</a>
</div>
{% endblock auth_content %}
